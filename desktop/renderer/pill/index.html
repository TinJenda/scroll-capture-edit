<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>SnapFlow – Scrolling capture</title>
    <style>
      html, body { margin: 0; overflow: hidden; background: transparent; font: 13px/1.35 system-ui, 'Segoe UI', sans-serif; user-select: none; }
      .pill { box-sizing: border-box; height: 100vh; display: flex; align-items: center; gap: 10px; padding: 0 12px; background: #14161c; color: #eceef4; border: 1px solid #343948; border-radius: 12px; }
      .dot { width: 9px; height: 9px; border-radius: 50%; background: #3ddc97; animation: pulse 1s infinite alternate; flex: none; }
      @keyframes pulse { from { opacity: 0.35; } to { opacity: 1; } }
      .text { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .text small { color: #9aa1b2; margin-left: 6px; }
      button { font: inherit; border: 0; border-radius: 8px; padding: 6px 12px; cursor: pointer; color: #fff; }
      #stop { background: #4f6df5; }
      #discard { background: #313644; }
      kbd { background: rgba(255,255,255,.18); border-radius: 4px; padding: 0 5px; font: inherit; font-size: 11px; }
    </style>
  </head>
  <body>
    <div class="pill">
      <span class="dot"></span>
      <div class="text"><span id="main">Scrolling capture…</span><small id="note"></small></div>
      <button id="stop" type="button">Stop &amp; use <kbd>Esc</kbd></button>
      <button id="discard" type="button">Discard</button>
    </div>
    <script type="module" src="./pill.ts"></script>
  </body>
</html>
