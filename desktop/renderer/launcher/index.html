<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SnapFlow</title>
  </head>
  <body>
    <main class="wrap">
      <h1>SnapFlow</h1>
      <p class="muted">Capture anything on your screen. Nothing leaves your computer.</p>
      <div class="grid" id="grid"></div>
      <p class="hint" id="hint"></p>
      <div class="links">
        <button type="button" class="link" id="history">Recent screenshots</button>
        <button type="button" class="link" id="settings">Settings</button>
      </div>
    </main>
    <script type="module" src="./launcher.ts"></script>
  </body>
</html>
