<!doctype html><html><head><meta charset="utf-8"><title>Wide table</title>
<style>html,body{margin:0;background:#fff;font:16px system-ui}
h1{margin:12px 40px}
#wt{position:absolute;left:40px;top:80px;width:600px;height:200px;overflow:auto;border:2px solid #000;box-sizing:content-box}
#inner{display:flex;width:4000px;height:150px}
#inner div{flex:none;width:100px;height:150px}
</style></head>
<body><h1>Wide table</h1><div id="wt"><div id="inner"></div></div>
<script src="/_bands.js"></script>
<script>
const inner = document.getElementById('inner');
for (let i = 0; i < 40; i++) { const c = document.createElement('div'); c.style.background = bandCss(i); inner.appendChild(c); }
</script></body></html>
