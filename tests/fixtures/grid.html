<!doctype html><html><head><meta charset="utf-8"><title>2-D grid</title>
<style>html,body{margin:0;background:#fff}
#g{position:absolute;left:40px;top:40px;width:400px;height:300px;overflow:auto;border:2px solid #000;box-sizing:content-box}
#inner{display:grid;grid-template-columns:repeat(10,100px);grid-auto-rows:100px;width:1000px;height:1000px}
</style></head>
<body><div id="g"><div id="inner"></div></div>
<script>
const inner = document.getElementById('inner');
for (let r = 0; r < 10; r++) for (let c = 0; c < 10; c++) { const d = document.createElement('div'); d.style.background = `rgb(${c * 25},${r * 25},128)`; inner.appendChild(d); }
</script></body></html>
